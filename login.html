<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LubriPlan - Connexion</title>
    <style>
        body { background-color: #1e293b; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; width: 400px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        .header { background: #1a2c42; color: white; padding: 40px 20px; }
        .form-container { padding: 30px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #64748b; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fefce8; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #1a2c42; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .creds { margin-top: 20px; font-size: 0.8rem; color: #64748b; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header">
            <h1 style="margin:0">LubriPlan</h1>
            <p style="opacity:0.8">Gestion Graissage & Vidange</p>
        </div>
        <div class="form-container">
            <label>Identifiant</label>
            <input type="text" id="username" placeholder="admin">
            
            <label>Mot de passe</label>
            <input type="password" id="password" placeholder="••••••••">
            
            <button onclick="checkLogin()">Se connecter</button>
            
            <div class="creds">
                Admin : admin / aadmine123 <br> Tech : ahmed.b / tech1234
            </div>
        </div>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Logique simple pour ton projet
            if ((user === "admin" && pass === "admin123") || (user === "ahmed.b" && pass === "tech1234")) {
                window.location.href = "index.html"; // Redirige vers le tableau de bord
            } else {
                alert("Identifiants incorrects !");
            }
        }
    </script>
</body>
</html>
